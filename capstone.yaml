name: flyrank-capstone-image-relevance
run: python -m uvicorn app.main:app --host 127.0.0.1 --port 8000
seed: python -m app.seed
test: python -m pytest -q
base_url: http://127.0.0.1:8000
endpoints:
  - GET /health
  - GET /api/images
  - POST /api/jobs/vision
  - GET /api/jobs/{job_id}
  - POST /api/posts
  - GET /api/posts/{post_id}/images
  - POST /api/matches/guard
  - POST /api/reviews
  - GET /api/costs
  - POST /api/evaluation/run
